name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ] # 當你推送程式碼時自動觸發

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 賦予自動建立 Release 的權限

    steps:
      - name: 檢查程式碼
        uses: actions/checkout@v4

      - name: 設定 Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 賦予 Gradle 執行權限
        run: chmod +x gradlew

      - name: 編譯 Debug APK
        run: ./gradlew assembleDebug

      - name: 自動發布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0-${{ github.run_number }}"
          name: "🍉 西瓜跑刀助手 v1.0-${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
          body: "自動編譯的最新戰術雷達與撤離倒數版本，點擊下方檔案即可直接下載安裝！"
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
